name: Supabase production migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print pending migrations without applying SQL"
        type: boolean
        default: false
      baseline_repair:
        description: "Mark every migration file in this repo as already applied (no SQL). Use once if prod was built from schema.sql and SQL already matches."
        type: boolean
        default: false

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.67.1

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify CLI version
        run: supabase --version

      - name: Require database URL secret
        id: db_url
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::GitHub secret SUPABASE_DB_URL is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URL (postgresql://...)."
              exit 1
              ;;
          esac
          # Supabase CLI requires a percent-encoded connection string (especially the password).
          encoded="$(python3 -c "
          import os, re, sys
          from urllib.parse import quote, unquote
          raw = os.environ['SUPABASE_DB_URL'].strip()
          m = re.match(r'^(postgres(?:ql)?)://([^:@/]+):([^@]+)@([^?#]+)(.*)$', raw)
          if not m:
            print('::error::Could not parse SUPABASE_DB_URL user/password/host.', file=sys.stderr)
            sys.exit(1)
          scheme, user, password, hostport, rest = m.groups()
          # Decode then re-encode to fix mixed/invalid % sequences in the stored secret.
          password_enc = quote(unquote(password), safe='')
          user_enc = quote(unquote(user), safe='')
          print(f'{scheme}://{user_enc}:{password_enc}@{hostport}{rest}')
          ")"
          echo "encoded_db_url=${encoded}" >> "$GITHUB_OUTPUT"

      - name: Baseline repair (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_repair == true }}
        env:
          SUPABASE_DB_URL: ${{ steps.db_url.outputs.encoded_db_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No migration files found."
            exit 0
          fi
          for f in "${files[@]}"; do
            version="$(basename "$f" .sql)"
            echo "Marking migration as applied: ${version}"
            supabase migration repair "$version" \
              --status applied \
              --db-url "$SUPABASE_DB_URL" \
              --yes
          done

      - name: Dry run (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && inputs.baseline_repair != true }}
        env:
          SUPABASE_DB_URL: ${{ steps.db_url.outputs.encoded_db_url }}
        run: |
          set -euo pipefail
          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all \
            --dry-run \
            --yes

      - name: Repair legacy migration history (20261110 → filename version)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.baseline_repair == true || inputs.dry_run == true)) }}
        env:
          SUPABASE_DB_URL: ${{ steps.db_url.outputs.encoded_db_url }}
        run: |
          set -euo pipefail
          # Older pushes recorded version "20261110" while CLI tracks full migration filenames.
          supabase migration repair 20261110 --status reverted \
            --db-url "$SUPABASE_DB_URL" --yes 2>/dev/null || true
          supabase migration repair 20261110_duration_objectives --status applied \
            --db-url "$SUPABASE_DB_URL" --yes 2>/dev/null || true

      - name: Push pending migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.baseline_repair == true || inputs.dry_run == true)) }}
        env:
          SUPABASE_DB_URL: ${{ steps.db_url.outputs.encoded_db_url }}
        run: |
          set -euo pipefail
          # --include-all: apply local migrations missing from remote history (safe with IF NOT EXISTS SQL).
          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all \
            --yes
