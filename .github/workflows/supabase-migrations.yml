name: Supabase production migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print pending migrations without applying SQL"
        type: boolean
        default: false
      baseline_repair:
        description: "Mark every migration file in this repo as already applied (no SQL). Use once if prod was built from schema.sql and SQL already matches."
        type: boolean
        default: false

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.67.1

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify CLI version
        run: supabase --version

      - name: Require database URL secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::GitHub secret SUPABASE_DB_URL is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URL (postgresql://...)."
              exit 1
              ;;
          esac

      - name: Baseline repair (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_repair == true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No migration files found."
            exit 0
          fi
          for f in "${files[@]}"; do
            version="$(basename "$f" .sql)"
            echo "Marking migration as applied: ${version}"
            supabase migration repair "$version" \
              --status applied \
              --db-url "$SUPABASE_DB_URL" \
              --linked false \
              --yes
          done

      - name: Dry run (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && inputs.baseline_repair != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --linked false \
            --include-all \
            --dry-run \
            --yes

      - name: Push pending migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.baseline_repair == true || inputs.dry_run == true)) }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # --include-all: apply local migrations missing from remote history (safe with IF NOT EXISTS SQL).
          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --linked false \
            --include-all \
            --yes
